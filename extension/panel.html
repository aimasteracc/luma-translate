<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Luma Translate</title><link rel="stylesheet" href="ui.css"></head>
<body class="panel">
  <header class="panel-header"><div class="brand"><svg viewBox="0 0 32 36" aria-hidden="true"><path d="M27 2C8 2 1 13 6 25c5-8 11-10 16-14-3 6-10 9-15 16l-3 6 3 1 4-8C25 29 31 15 27 2Z"/></svg>Luma Translate</div></header>
  <main class="panel-body">
    <div class="panel-intro"><div class="row between"><span class="eyebrow">READ WITHOUT LIMITS</span><span class="badge" id="provider-badge">DeepSeek</span></div><h1>このページを翻訳</h1><p>ページ全体も、気になる一文も。</p></div>
    <section class="setup-card" id="setup-card" hidden><h3>あなたの API で、はじめよう。</h3><p>DeepSeek の API キーを一度登録すれば、このページから翻訳できます。</p><button class="primary open-settings full">API キーを設定</button></section>
    <section class="setup-card" id="access-card" hidden><h3>このサイトで翻訳を使う</h3><p id="access-origin"></p><p>このサイトだけにアクセスを許可します。別のサイトは個別に選べます。</p><button class="primary full" id="grant-access">このサイトを許可</button></section>
    <div class="language-row"><span class="detected">原文を自動検出</span><span aria-hidden="true">→</span><select id="target" aria-label="翻訳先の言語"></select></div>
    <div class="actions">
      <button class="primary icon-text" id="translate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v15M3 4c4-1 7 0 9 2 2-2 5-3 9-2v15c-4-1-7 0-9 2-2-2-5-3-9-2Z"/></svg>ページ全体を翻訳</button>
      <button class="secondary icon-text" id="selection"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H4v4m12-4h4v4M4 17v4h4m12-4v4h-4M4 11v2m16-2v2M11 3h2m-2 18h2"/></svg>選択範囲を翻訳</button>
      <button id="cancel" hidden>翻訳を中断</button>
    </div>
    <div class="progress" id="progress-area" hidden><div class="progress-head"><span id="progress-label">翻訳しています</span><span id="progress-count"></span></div><progress id="progress" value="0" max="1" aria-label="翻訳の進捗"></progress></div>
    <p class="notice" id="status" role="status" aria-live="polite"></p>
    <div class="preferences">
      <label>表示形式</label>
      <div class="segmented" role="group" aria-label="表示形式"><button data-view="bilingual" aria-pressed="true">原文＋訳文</button><button data-view="translation" aria-pressed="false">訳文のみ</button></div>
      <div class="style-row"><label for="style">翻訳のスタイル</label><select id="style"><option value="natural">自然な文章</option><option value="faithful">原文に忠実</option><option value="simple">やさしい文章</option></select></div>
      <div class="divider"></div>
      <label class="switch-row"><div class="switch-copy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6Z M14 3v5h5M9 12h7m-7 4h7"/></svg><div><b>用語辞書</b><span>登録した専門用語を優先して翻訳。</span></div></div><input class="switch" type="checkbox" id="glossary" aria-label="用語辞書を使う"></label>
      <label class="switch-row"><div class="switch-copy"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><div><b>このサイトで自動翻訳</b><span>次回から本文を自動で翻訳します。</span></div></div><input class="switch" type="checkbox" id="auto" aria-label="このサイトで自動翻訳"></label>
      <div class="quick-links"><button class="quiet icon-text" id="restore"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12"/></svg>原文に戻す</button><button class="quiet" id="retry" hidden>失敗した箇所を再試行</button></div>
    </div>
    <p class="privacy">翻訳する文章を設定した API に送信します。API の利用料金はプロバイダー側で発生します。</p>
  </main>
  <footer class="panel-footer"><button class="quiet icon-text open-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1 1 4-2 3 3 2 1 4 4-1 3 2 2-3 4-1-1-4 2-3-3-2-1-4-4 1Z"/></svg>設定</button><button class="quiet icon-text" id="plugins"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h5a3 3 0 1 1 6 0h5v5a3 3 0 1 0 0 6v5h-5a3 3 0 1 0-6 0H4v-5a3 3 0 1 1 0-6Z"/></svg>拡張機能</button></footer>
  <dialog class="dialog" id="plugins-dialog"><div class="row between"><h2>翻訳を、自分仕様に。</h2><button class="quiet icon-button" id="close-plugins" aria-label="閉じる">×</button></div><p class="hint">機能ごとに有効・無効を切り替えられます。</p><p id="plugin-status" role="status"></p><div id="plugin-list"></div><button class="primary full open-settings" style="margin-top:22px">API・翻訳ルールを設定</button></dialog>
  <script type="module" src="panel.js"></script>
</body>
</html>
